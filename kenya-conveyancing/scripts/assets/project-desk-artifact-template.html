    <nav style="margin:14px 0 0;display:flex;flex-direction:column;gap:2px">
      <sc-for list="{{ tree }}" as="t" hint-placeholder-count="12">
      <button onClick="{{ t.go }}" style="display:flex;align-items:center;gap:9px;padding:{{ t.pad }};border:0;border-radius:9px;cursor:{{ t.cursor }};text-align:left;background:{{ t.bg }};color:{{ t.fg }};font-size:{{ t.size }};font-weight:{{ t.weight }};letter-spacing:{{ t.ls }};text-transform:{{ t.tt }};opacity:{{ t.op }};width:100%;box-sizing:border-box">
        <span style="flex:none;display:grid;place-items:center;width:14px">{{ t.glyph }}</span>
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ t.label }}</span>
        <span style="flex:none;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:{{ t.badgeFg }};background:{{ t.badgeBg }};padding:1px 6px;border-radius:20px">{{ t.badge }}</span>
      </button>
      </sc-for>
    </nav>

    <div style="flex:1;min-height:18px"></div>

    <div style="display:flex;gap:6px;margin-bottom:12px"><input id="desk-search" onKeyDown="{{ onSearchKey }}" placeholder="Unit number or purchaser" style="flex:1;min-width:0;font:inherit;font-size:12px;padding:8px 10px;border:1px solid var(--side-line);border-radius:10px;background:transparent;color:var(--side-fg);outline:none"><button onClick="{{ runSearch }}" title="Search" style="border:1px solid var(--side-line);background:transparent;color:var(--side-fg);border-radius:10px;width:34px;cursor:pointer;font-size:14px">⌕</button></div>
    <sc-if value="{{ picked }}" hint-placeholder-val="{{ false }}">
    <div style="margin:0 2px 12px;padding:9px 11px;border:1px solid var(--side-line);border-radius:10px"><div style="font-size:12.5px;font-weight:700">{{ viewerName }}</div><div style="font-size:10px;color:var(--side-mut);letter-spacing:.08em;text-transform:uppercase;margin-top:2px">{{ viewerRoleLabel }}</div></div>
    </sc-if>
    <sc-if value="{{ showPicker }}" hint-placeholder-val="{{ true }}">
    <div style="margin:0 2px 7px;font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--side-mut)">Viewing as · demo</div>
    <div style="display:flex;gap:6px;margin-bottom:12px">
      <sc-for list="{{ viewers }}" as="v" hint-placeholder-count="3">
      <button onClick="{{ v.go }}" title="{{ v.name }}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 4px;border:1px solid {{ v.line }};border-radius:10px;background:{{ v.bg }};color:var(--side-fg);cursor:pointer">
        <span style="width:26px;height:26px;border-radius:50%;background:var(--gold);color:#111;display:grid;place-items:center;font-weight:700;font-size:10.5px">{{ v.ini }}</span>
        <span style="font-size:10.5px;font-weight:{{ v.weight }}">{{ v.first }}</span>
      </button>
      </sc-for>
    </div>
    </sc-if>

    <button onClick="{{ toggleTheme }}" style="display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border:1px solid var(--side-line);border-radius:10px;background:transparent;color:var(--side-fg);cursor:pointer;font-size:12px">
      <span>{{ themeLabel }}</span>
      <span style="width:34px;height:18px;border-radius:9px;background:var(--track);border:1px solid var(--side-line);position:relative;flex:none;box-sizing:border-box"><span style="position:absolute;top:1px;width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);left:{{ knobLeft }};transition:left .18s"></span></span>
    </button>
    <div onClick="{{ refreshLive }}" title="{{ liveTitle }}" style="margin-top:10px;display:flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--side-line);border-radius:10px;cursor:pointer;font-size:11px;color:var(--side-fg)"><span style="width:8px;height:8px;border-radius:50%;background:{{ liveDot }};flex:none"></span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ liveLabel }}</span></div><div style="margin-top:10px;font-size:10px;color:var(--side-mut);text-align:center">{{ sideDate }}</div>
  </aside>

  <div style="flex:1;min-width:0;padding:26px 34px 80px;max-width:1220px">

    <!-- ═══════════ HOME · the person axis ═══════════ -->
    <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
    <main data-screen-label="Home">

      <sc-if value="{{ needsIdentity }}" hint-placeholder-val="{{ false }}">
      <section style="background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:16px">
        <div style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-ink);font-weight:700">Fallback</div>
        <h2 style="margin:6px 0 4px;font-size:17px">We could not read your mailbox</h2>
        <div style="font-size:13px;color:var(--ink2);max-width:60ch;text-wrap:pretty">Identity is normally derived from your own Microsoft 365 connection. That call returned nothing, so pick your name once for this session.</div>
        <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
          <sc-for list="{{ viewers }}" as="v" hint-placeholder-count="3">
          <button onClick="{{ v.go }}" style="padding:8px 15px;border:1px solid var(--line2);background:transparent;color:var(--ink);border-radius:9px;cursor:pointer;font-size:13px;font-weight:600">{{ v.name }}</button>
          </sc-for>
        </div>
      </section>
      </sc-if>

      <!-- ── Good morning ── -->
